<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Titre, description, canonical, hreflang, partage et données structurées propres à
         chaque page : générés par src/seo.js et injectés au build par scripts/prerender.js -->
    <!--app-head-->
    <!-- Applique le thème mémorisé avant le premier affichage (évite le flash). -->
    <script>
      try {
        var theme = localStorage.getItem('myblok-theme')
        if (theme) document.documentElement.setAttribute('data-theme', theme)
      } catch (e) {}
    </script>
    <meta name="theme-color" content="#f4f2ec" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / réseaux sociaux -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="myblok" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Sans JS, le contenu prérendu reste visible (les .reveal sont masqués jusqu'à l'animation) -->
    <noscript><style>.reveal { opacity: 1 !important; transform: none !important; }</style></noscript>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
